<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>🏎️ CarBattle Arena - Battle Royale</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Configure o servidor WebSocket aqui -->
  <script>
    // ⚠️ ATENÇÃO: VOCÊ PRECISA CONFIGURAR ISTO! ⚠️
    // 
    // O Netlify serve APENAS o frontend (arquivos HTML/JS/CSS)
    // Você PRECISA fazer deploy do SERVIDOR em outro lugar!
    //
    // PASSO 1: Deploy do servidor WebSocket
    // Use um destes serviços (GRÁTIS):
    // - Render.com: https://render.com (RECOMENDADO)
    // - Railway.app: https://railway.app
    // - Fly.io: https://fly.io
    //
    // PASSO 2: Configure a URL abaixo
    // Exemplo: window.WS_SERVER_URL = 'wss://seu-servidor.onrender.com';
    //
    // ⚠️ SEM ISTO O JOGO NÃO FUNCIONA! ⚠️
    
    // DESCOMENTE E CONFIGURE AQUI:
    // window.WS_SERVER_URL = 'wss://seu-servidor-websocket.onrender.com';
    
    // Se não configurar, vai mostrar um erro explicativo
    if (!window.WS_SERVER_URL) {
      console.error('❌ SERVIDOR WEBSOCKET NÃO CONFIGURADO!');
      console.error('📖 Leia as instruções no index.html');
      console.error('🚀 Deploy o servidor em https://render.com');
      console.error('⚙️ Configure window.WS_SERVER_URL com a URL do servidor');
    }
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Conectando ao servidor...</div>
    <div id="error-help" style="display: none; margin-top: 20px;">
      <a href="CONFIGURAR.html" style="color: #64c8ff; text-decoration: none; font-weight: 700; background: rgba(100, 200, 255, 0.2); padding: 12px 24px; border-radius: 8px; display: inline-block;">
        📖 Ver Instruções de Configuração
      </a>
    </div>
  </div>
  
  <div id="hud">
    <div id="info">Conectando...</div>
    <div id="stats">
      <div class="stat"><span class="label">HP:</span> <div class="bar"><div class="fill hp-fill"></div></div></div>
      <div class="stat"><span class="label">Boost:</span> <div class="bar"><div class="fill boost-fill"></div></div></div>
      <div class="stat"><span class="label">Shield:</span> <div class="bar"><div class="fill shield-fill"></div></div></div>
      <div class="stat"><span class="label">Kills:</span> <span id="kills">0</span></div>
    </div>
    <div id="zone">Arena: <span id="arena-radius">600</span>m</div>
  </div>
  <div id="leaderboard">
    <h3>🏆 Top Players</h3>
    <div id="leader-list"></div>
  </div>
  <div id="controls">
    <div>⬆️⬇️⬅️➡️ Dirigir</div>
    <div>ESPAÇO Atirar</div>
    <div>SHIFT Boost</div>
  </div>
  
  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <div id="joystick-area">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>
    <div id="mobile-buttons">
      <button id="btn-shoot" class="mobile-btn">🔫<br>ATIRAR</button>
      <button id="btn-boost" class="mobile-btn">⚡<br>BOOST</button>
    </div>
  </div>
  
  <canvas id="game"></canvas>
  <script src="game.js"></script>
</body>
</html>
